<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Noctvale critical hit triangles">
  <defs>
    <style>
      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #240f0f; }
      .node { font-family: Georgia, 'Times New Roman', serif; font-size: 11px; fill: #240f0f; }
      .callout { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #240f0f; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #240f0f; letter-spacing: 0.04em; text-transform: uppercase; }
      .ring { fill: none; stroke: #240f0f; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #240f0f; stroke-width: 1.25; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#240f0f"/>
    </marker>
  </defs>

  <!-- Weapon Triangle -->
  <g transform="translate(120, 95)">
    <text class="title" x="-55" y="-72" text-anchor="middle">Weapon</text>
    <circle class="ring" cx="0" cy="0" r="58"/>
    <text class="node" x="0" y="-38" text-anchor="middle">Sword</text>
    <text class="node" x="48" y="28" text-anchor="middle">Axe</text>
    <text class="node" x="-48" y="28" text-anchor="middle">Spear</text>
    <path class="arrow" d="M 0,-24 A 34 34 0 0 1 34,12"/>
    <path class="arrow" d="M 34,12 A 34 34 0 0 1 -34,12"/>
    <path class="arrow" d="M -34,12 A 34 34 0 0 1 0,-24"/>
    <text class="label" x="0" y="72" text-anchor="middle">Sword &gt; Axe &gt; Spear</text>
  </g>

  <!-- Mystic Triangle -->
  <g transform="translate(360, 95)">
    <text class="title" x="-55" y="-72" text-anchor="middle">Mystic</text>
    <circle class="ring" cx="0" cy="0" r="58"/>
    <text class="node" x="0" y="-38" text-anchor="middle">Light</text>
    <text class="node" x="48" y="28" text-anchor="middle">Infernal</text>
    <text class="node" x="-48" y="28" text-anchor="middle">Arcane</text>
    <path class="arrow" d="M 0,-24 A 34 34 0 0 1 34,12"/>
    <path class="arrow" d="M 34,12 A 34 34 0 0 1 -34,12"/>
    <path class="arrow" d="M -34,12 A 34 34 0 0 1 0,-24"/>
    <text class="label" x="0" y="72" text-anchor="middle">Light &gt; Infernal &gt; Arcane</text>
  </g>

  <!-- Natural Triangle -->
  <g transform="translate(600, 95)">
    <text class="title" x="-55" y="-72" text-anchor="middle">Natural</text>
    <circle class="ring" cx="0" cy="0" r="58"/>
    <text class="node" x="0" y="-38" text-anchor="middle">Nature</text>
    <text class="node" x="48" y="28" text-anchor="middle">Necromancy</text>
    <text class="node" x="-48" y="28" text-anchor="middle">Blood</text>
    <path class="arrow" d="M 0,-24 A 34 34 0 0 1 34,12"/>
    <path class="arrow" d="M 34,12 A 34 34 0 0 1 -34,12"/>
    <path class="arrow" d="M -34,12 A 34 34 0 0 1 0,-24"/>
    <text class="label" x="0" y="72" text-anchor="middle">Nature &gt; Necro &gt; Blood</text>
  </g>

  <!-- Callouts -->
  <g transform="translate(36, 230)">
    <text class="title" x="0" y="0">Outside the triangles</text>
    <text class="callout" x="0" y="20"><tspan font-weight="bold">Hammer</tspan>  natural 6 vs targets in Heavy Armor; cancels weapon triangle if either fighter wields Hammer</text>
    <text class="callout" x="0" y="38"><tspan font-weight="bold">Firearms</tspan>  critical hits vs all targets (Primer Roll first)</text>
    <text class="callout" x="0" y="56"><tspan font-weight="bold">Aim</tspan>  nat 6 crit on next Ranged action (5+ if weapon already crit on 6)</text>
    <text class="callout" x="0" y="82">Natural 6 = critical hit only when a printed advantage applies. Only Heavy Armor critical defense blocks critical hits.</text>
  </g>
</svg>
