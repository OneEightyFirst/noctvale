<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Noctvale ranged weapon maximum dice pool chart</title>
  <desc id="desc">Horizontal bar chart showing maximum Strike Pool dice for all current ranged weapon profiles.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ee; }
      .card { fill: #fffdf8; stroke: #d0c8ba; stroke-width: 1; }
      .ink { fill: #202020; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #5c5a55; font-family: Inter, Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: 700; }
      .axis { stroke: #302d28; stroke-width: 1.5; }
      .grid { stroke: #d8d0c4; stroke-width: 1; }
      .cap { stroke: #202020; stroke-width: 2; stroke-dasharray: 8 6; }
      .start { stroke: #fffdf8; stroke-width: 4; stroke-linecap: round; }
      .startText { fill: #fffdf8; font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .archery { fill: #2f7d6d; }
      .thrown { fill: #7a5ea8; }
      .firearm { fill: #9b3f35; }
      .bomb { fill: #8b6b2c; }
      .zero { fill: #c9c1b4; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="860"/>
  <text class="ink title" x="56" y="58">Ranged weapons: maximum Strike Pool dice</text>
  <text class="muted body" x="56" y="90">Scaling weapons assume a maxed fighter at Might 6 / Skill 6, then apply the 15-dice Strike Pool cap.</text>
  <text class="muted body" x="56" y="116">White marks show starting pools for a Steady fighter at Might 3 / Skill 3.</text>

  <rect class="card" x="55" y="145" width="1090" height="600" rx="8"/>

  <line class="axis" x1="285" y1="680" x2="1065" y2="680"/>
  <line class="axis" x1="285" y1="185" x2="285" y2="680"/>

  <g class="muted small">
    <line class="grid" x1="285" y1="185" x2="285" y2="680"/><text x="281" y="704">0</text>
    <line class="grid" x1="389" y1="185" x2="389" y2="680"/><text x="382" y="704">2</text>
    <line class="grid" x1="493" y1="185" x2="493" y2="680"/><text x="486" y="704">4</text>
    <line class="grid" x1="597" y1="185" x2="597" y2="680"/><text x="590" y="704">6</text>
    <line class="grid" x1="701" y1="185" x2="701" y2="680"/><text x="694" y="704">8</text>
    <line class="grid" x1="805" y1="185" x2="805" y2="680"/><text x="794" y="704">10</text>
    <line class="grid" x1="909" y1="185" x2="909" y2="680"/><text x="898" y="704">12</text>
    <line class="grid" x1="1013" y1="185" x2="1013" y2="680"/><text x="1002" y="704">14</text>
    <line class="cap" x1="1065" y1="185" x2="1065" y2="680"/><text x="1054" y="704">15</text>
  </g>
  <text class="muted small" x="555" y="728">Dice in the Strike Pool: bar end is maximum, white mark is starting pool</text>

  <rect class="archery" x="825" y="166" width="18" height="13"/><text class="ink small" x="850" y="178">Archery</text>
  <rect class="thrown" x="915" y="166" width="18" height="13"/><text class="ink small" x="940" y="178">Thrown</text>
  <rect class="firearm" x="1002" y="166" width="18" height="13"/><text class="ink small" x="1027" y="178">Firearms</text>
  <rect class="bomb" x="825" y="190" width="18" height="13"/><text class="ink small" x="850" y="202">Bombs</text>
  <line class="cap" x1="915" y1="197" x2="950" y2="197"/><text class="ink small" x="960" y="202">15-dice cap</text>
  <line class="start" x1="1060" y1="197" x2="1085" y2="197"/><text class="ink small" x="1095" y="202">Starting pool</text>

  <g>
    <text class="ink label" x="95" y="228">Heavy Crossbow</text>
    <rect class="archery" x="285" y="207" width="676" height="26" rx="3"/>
    <line class="start" x1="805" y1="204" x2="805" y2="236"/>
    <text class="startText" x="814" y="226">start 10</text>
    <text class="ink label" x="976" y="228">13</text>
  </g>
  <g>
    <text class="ink label" x="95" y="268">Shortbow</text>
    <rect class="archery" x="285" y="247" width="572" height="26" rx="3"/>
    <line class="start" x1="701" y1="244" x2="701" y2="276"/>
    <text class="startText" x="710" y="266">start 8</text>
    <text class="ink label" x="872" y="268">11</text>
  </g>
  <g>
    <text class="ink label" x="95" y="308">Longbow</text>
    <rect class="archery" x="285" y="287" width="624" height="26" rx="3"/>
    <line class="start" x1="753" y1="284" x2="753" y2="316"/>
    <text class="startText" x="762" y="306">start 9</text>
    <text class="ink label" x="924" y="308">12</text>
  </g>
  <g>
    <text class="ink label" x="95" y="348">Crossbow</text>
    <rect class="archery" x="285" y="327" width="624" height="26" rx="3"/>
    <line class="start" x1="753" y1="324" x2="753" y2="356"/>
    <text class="startText" x="762" y="346">start 9</text>
    <text class="ink label" x="924" y="348">12</text>
  </g>
  <g>
    <text class="ink label" x="95" y="388">Sling</text>
    <rect class="thrown" x="285" y="367" width="728" height="26" rx="3"/>
    <line class="start" x1="701" y1="364" x2="701" y2="396"/>
    <text class="startText" x="710" y="386">start 8</text>
    <text class="ink label" x="1028" y="388">14</text>
  </g>
  <g>
    <text class="ink label" x="95" y="428">Throwing Stars</text>
    <rect class="thrown" x="285" y="407" width="676" height="26" rx="3"/>
    <line class="start" x1="649" y1="404" x2="649" y2="436"/>
    <text class="startText" x="658" y="426">start 7</text>
    <text class="ink label" x="976" y="428">13</text>
  </g>
  <g>
    <text class="ink label" x="95" y="468">Musket</text>
    <rect class="firearm" x="285" y="447" width="676" height="26" rx="3"/>
    <line class="start" x1="805" y1="444" x2="805" y2="476"/>
    <text class="startText" x="814" y="466">start 10</text>
    <text class="ink label" x="976" y="468">13</text>
  </g>
  <g>
    <text class="ink label" x="95" y="508">Long Rifle</text>
    <rect class="firearm" x="285" y="487" width="728" height="26" rx="3"/>
    <line class="start" x1="857" y1="484" x2="857" y2="516"/>
    <text class="startText" x="866" y="506">start 11</text>
    <text class="ink label" x="1028" y="508">14</text>
  </g>
  <g>
    <text class="ink label" x="95" y="548">Pistol</text>
    <rect class="firearm" x="285" y="527" width="624" height="26" rx="3"/>
    <line class="start" x1="753" y1="524" x2="753" y2="556"/>
    <text class="startText" x="762" y="546">start 9</text>
    <text class="ink label" x="924" y="548">12</text>
  </g>
  <g>
    <text class="ink label" x="95" y="588">Blunderbuss</text>
    <rect class="firearm" x="285" y="567" width="572" height="26" rx="3"/>
    <line class="start" x1="701" y1="564" x2="701" y2="596"/>
    <text class="startText" x="710" y="586">start 8</text>
    <text class="ink label" x="872" y="588">11</text>
  </g>
  <g>
    <text class="ink label" x="95" y="628">Bomb</text>
    <rect class="bomb" x="285" y="607" width="260" height="26" rx="3"/>
    <text class="ink label" x="560" y="628">5</text>
  </g>
  <g>
    <text class="ink label" x="95" y="668">Smoke Bomb</text>
    <rect class="zero" x="285" y="647" width="8" height="26" rx="3"/>
    <text class="ink label" x="305" y="668">0</text>
  </g>

  <rect class="card" x="55" y="768" width="1090" height="58" rx="8"/>
  <text class="muted small" x="80" y="793">Read: bows scale from Might with fixed Skill; crossbows and firearms use fixed Might plus Skill scaling.</text>
  <text class="muted small" x="80" y="815">Brace of Pistols / Gunslinger is not shown as one pool because it resolves two separate Pistol attacks, each with its own Primer Roll and Attack Sequence.</text>
</svg>
